# ============================================================
# LangGraph ReAct Agent - Docker Compose 编排（HTTP API 服务）
#
# 用法：
#   1. 复制 .env.example 为 .env 并填写 AGENT_OPENAI_API_KEY
#   2. docker compose up -d --build     # 构建并启动 API 服务（常驻）
#   3. curl http://localhost:8000/api/health   # 验证
#   4. curl -X POST http://localhost:8000/api/ask \
#        -H "Content-Type: application/json" \
#        -d '{"question":"计算 2**10","session_id":"demo"}'
#
# 备用（CLI 一次性运行）：
#   docker compose run --rm agent python main.py --question "计算 2**10"
#   docker compose run --rm agent   # 交互式对话（Ctrl+D / exit 退出）
#
# 说明：
#   - 默认常驻运行 HTTP API 服务（restart: unless-stopped 自动重启）。
#   - 敏感配置通过 env_file (.env) 注入，.env 已被 .dockerignore 排除不进镜像。
#   - 可选代理：Docker NAT 出口 IP 可能被搜索引擎降级导致结果异常，
#     在宿主环境变量设置 HTTP_PROXY/HTTPS_PROXY 可透传给容器（如走本机 Clash）。
# ============================================================
name: react-agent

services:
  agent:
    build: .
    image: react-agent:latest
    container_name: react-agent
    restart: unless-stopped          # 容器异常退出自动重启（生产常驻）
    env_file:
      - .env
    environment:
      # 可选：把宿主代理透传给容器（requests 自动读取），修复容器内搜索降级
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      # 记忆数据库写到挂载的数据目录（容器删除后记忆依然保留）
      AGENT_MEMORY_DB_PATH: /app/memory_data/memory.db
    # HTTP API 端口映射：宿主 8000 -> 容器 8000
    ports:
      - "8000:8000"
    # 记忆持久化：宿主 ./memory_data 目录挂载到容器 /app/memory_data，
    # 短期+长期对话记忆保存在 memory_data/memory.db，不随容器删除而丢失
    volumes:
      - ./memory_data:/app/memory_data
